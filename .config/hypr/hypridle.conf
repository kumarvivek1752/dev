# Locks the session around suspend, and on idle.
#
# Why hypridle rather than `hyprlock & systemctl suspend`:
# hypridle holds a logind *delay* inhibitor, so before_sleep_cmd is guaranteed to
# finish before the system actually suspends. Backgrounding hyprlock with `&` and
# suspending immediately races the compositor and can suspend with the desktop
# still visible -- that race is what the 2026-09-05 notes hit.

general {
    # runs when logind emits Lock (i.e. on `loginctl lock-session`)
    lock_cmd       = pidof hyprlock || hyprlock
    unlock_cmd     = pkill -USR1 hyprlock
    # runs BEFORE the system suspends, while the inhibitor is held
    before_sleep_cmd = loginctl lock-session
    # screen back on after resume
    after_sleep_cmd  = hyprctl dispatch dpms on
    ignore_dbus_inhibit = false
}

# dim the backlight as a warning before locking.
# brightnessctl -r restores from a save file that only exists once -s has run,
# so the save and the restore must be paired on the same listener. Brightness
# across suspend/resume is NOT handled here -- the EC resets it, so that is
# /etc/systemd/system-sleep/brightness instead.
listener {
    timeout     = 540
    on-timeout  = brightnessctl -s set 10
    on-resume   = brightnessctl -r || brightnessctl set 50%
}

# lock after 10 minutes idle
listener {
    timeout     = 600
    on-timeout  = loginctl lock-session
}

# screen off after 11 minutes
listener {
    timeout     = 660
    on-timeout  = hyprctl dispatch dpms off
    on-resume   = hyprctl dispatch dpms on
}
