# Minimal Hyprlock Configuration

background {
    monitor =
    path = screenshot
    color = rgba(25, 20, 20, 1.0)
    blur_passes = 2
    brightness = 0.2
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3
    dots_size = 0.33
    dots_spacing = 0.15
    dots_center = true
    dots_rounding = -1
    outer_color = rgb(151515)
    inner_color = rgb(200, 200, 200)
    font_color = rgb(10, 10, 10)
    fade_on_empty = false
    placeholder_text = <i>Input Password...</i>
    hide_input = false
    position = 0, -20
    halign = center
    valign = center
}

# NOTE: brightness is deliberately NOT touched here any more.
# This file used to carry an invisible label running `brightnessctl s 4` on
# every render, which fought the idle dimmer, the sleep hook and the manual
# keys for the same control. Owners now:
#   suspend/resume -> /etc/systemd/system-sleep/brightness
#   idle dim       -> ~/.config/hypr/hypridle.conf
#   manual         -> XF86MonBrightness{Up,Down} binds in hyprland.conf
