# ====================================================================
# Configuration for sub_search MPV script
# Location: ~/.config/mpv/script-opts/sub_search.conf
# ====================================================================

# Subtitle search URL pattern.
# {title} will be replaced with the cleaned, URL-encoded video name.
#
# Presets:
# 1. Subdl (Fast, multi-language, clean downloads):
search_url=https://subdl.com/search/{title}
#
# 2. OpenSubtitles (Largest community database):
# search_url=https://www.opensubtitles.org/en/search/sublanguageid-eng/moviename-{title}
#
# 3. Google (Direct SRT search):
# search_url=https://www.google.com/search?q={title}+english+subtitles+srt

# Browser command used to launch search page
browser_cmd=xdg-open

# Optional extra custom words/tags to strip from video filenames (comma-separated)
# Example: custom_strip_words=mychannel, specialrip, customtag
custom_strip_words=

# Automatically remove 4-digit year on fallback search to prevent release year mismatches (e.g. 2024 vs 2025)
strip_year_on_fallback=yes

# OSD notification duration in seconds
osd_duration=3.5
